# Shizuku 常驻 —— 配置
# 改完保存即生效，不用重启（守护每一轮都会重新读取本文件）

# ============ 运行模式 ============
# 1 = 永久开启（推荐）：开机即拉起并常驻，进程一没就补回来。
#     ★ 全局生效：任何用 Shizuku 的应用都能拿到授权，
#       以后装了新的 App 也不用改这里的任何东西。
# 0 = 按需唤醒：只在下面"目标应用"处于前台时才拉起
ALWAYS_ON=1

# ============ 按需模式的目标应用（ALWAYS_ON=1 时完全不用管）============
# 手工列表：可写任意包名，空格分隔，想加几个加几个
WATCH_APPS="moe.ouom.neriplayer"

# 1 = 自动发现：定期扫描所有声明了 Shizuku 权限的应用，自动纳入监听
#     新装的应用无需手动添加（结果缓存在 /data/adb/shizuku_keep.auto）
AUTO_WATCH=1

# 自动重扫间隔（秒），1800 = 半小时重扫一次
AUTO_RESCAN=1800

# 排除名单：自动发现扫到了、但你不想要的应用
# 在 WebUI 里点「删除」会自动写到这里，下次扫描不会再加回来
EXCLUDE_APPS=""

# ============ 心跳 ============
# 服务不在时的检查间隔（秒）
POLL_DEAD=6
# 服务健在时的心跳间隔（秒，开销极小）
POLL_ALIVE=12

# ============ 兼容性 ============
# Shizuku 的包名。官方版是 moe.shizuku.privileged.api；
# 用改过包名的分支版本时改这里就行，其它地方不用动。
SHIZUKU_PKG="moe.shizuku.privileged.api"
